name: Linux check

# The Linux code can't be compiled on a Windows dev machine (GTK / WebKitGTK are Linux libraries), so every push
# that touches the app compiles and tests it on Ubuntu. No packages, no release.
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "src/**", "package.json", "package-lock.json", ".github/workflows/linux-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # a partly restored cache leaves sherpa-onnx's download folder without its libs; force a fresh download
      - name: Reset sherpa-onnx download cache
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - run: npm ci

      # cargo test compiles the app, which embeds ../dist
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
