name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # creates the draft release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # sherpa-onnx-sys reuses target/sherpa-onnx-prebuilt when the folder exists; a partly restored cache leaves it
      # without the .a/.lib files ("could not find native static library"). Drop it so the build downloads it fresh.
      - name: Reset sherpa-onnx download cache
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - run: npm ci

      # cargo test compiles the app, which embeds ../dist
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # a pasted secret often ends with a newline, which the signer rejects: strip whitespace before it is used
      - name: Clean the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$(printf %s "$KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update files (in-app updater). Key made with `npx tauri signer generate --ci`: no password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # update files + latest.json only when the signing key secret is set; without it releases still build
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # a manual run from a branch only builds; releases come from tags
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Dynamic Notch Island ${{ github.ref_name }}"
          releaseBody: "Downloads for Windows (.exe) and Linux (.deb, .rpm, .AppImage). See the [README](https://github.com/Shafat21/DynamicNotch#readme) for install steps."
          releaseDraft: true
          prerelease: false

  # tauri-action writes api.github.com asset URLs into latest.json; those count against GitHub's 60-requests-an-hour
  # limit per IP for anonymous clients, so updates fail with "403 Forbidden" for anyone who hits it. Point them at the
  # public download links instead.
  public-update-urls:
    needs: build
    if: github.ref_type == 'tag' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Rewrite latest.json
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json; then
            echo "no latest.json (updater signing is off): nothing to rewrite"; exit 0
          fi
          python3 - <<'PY'
          import json, os, subprocess
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          d = json.load(open("latest.json"))
          for p in d["platforms"].values():
              u = p["url"]
              if u.startswith("https://api.github.com/"):
                  name = subprocess.check_output(["gh", "api", u.removeprefix("https://api.github.com/"), "--jq", ".name"], text=True).strip()
                  p["url"] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
          json.dump(d, open("latest.json", "w"), indent=2)
          PY
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          cat latest.json
