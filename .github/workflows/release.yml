name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # creates the draft release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      # cargo test compiles the app, which embeds ../dist
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # a manual run from a branch only builds; releases come from tags
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Dynamic Notch Island ${{ github.ref_name }}"
          releaseBody: "Downloads for Windows (.exe) and Linux (.deb, .rpm, .AppImage). See the [README](https://github.com/Shafat21/DynamicNotch#readme) for install steps."
          releaseDraft: true
          prerelease: false
