<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Notch Island</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- #shell animates size/position; #island clips its layers to the pill shape. -->
    <div id="shell">
      <div class="charge"><div class="beam l"></div><div class="beam r"></div></div>
      <div class="ear l"></div>
      <div class="ear r"></div>
      <div id="island">
        <div class="bg bg-weather"></div>
        <div class="bg bg-perf"></div>
        <div class="bg bg-calendar"></div>
        <div class="bg bg-month"></div>
        <div class="fx"></div>
        <div class="shine"></div>

        <div id="content"><div id="view">
          <!-- Header: idle clock / playing title, notifications -->
          <div class="header" id="header">
            <span class="icon" id="status-pal"></span>
            <span class="icon" id="status-icon" hidden></span>
            <span class="title" id="status-text"></span>
          </div>

          <!-- Music player card (spec §14.1) -->
          <section class="panel" id="panel-media" hidden>
            <div class="player-top">
              <div class="player-art"><img id="player-art" alt="" hidden /></div>
              <div class="player-info">
                <div class="player-title-row">
                  <span class="player-title" id="player-title"></span>
                  <span class="eq" id="player-eq"><i></i><i></i><i></i><i></i></span>
                </div>
                <div class="player-artist" id="player-artist"></div>
              </div>
              <button class="bar-btn" data-view="dashboard" data-icon="home" data-size="16" title="Home"></button>
            </div>
            <div class="player-progress" id="player-progress">
              <span id="player-elapsed">0:00</span>
              <div class="player-track" id="player-track"><div class="player-line"><div id="player-fill"></div></div></div>
              <span id="player-remaining">-0:00</span>
            </div>
            <div class="player-controls">
              <button class="media-btn" id="btn-lyrics" data-icon="lyrics" title="Lyrics" aria-pressed="false"></button>
              <span class="spacer"></span>
              <button class="media-btn big" data-media="prev" data-icon="prev" data-size="26" title="Previous"></button>
              <button class="media-btn big" data-media="toggle" id="btn-play" data-icon="play" data-size="32" title="Play/Pause"></button>
              <button class="media-btn big" data-media="next" data-icon="next" data-size="26" title="Next"></button>
              <span class="spacer"></span>
              <button class="media-btn" id="btn-open-player" data-icon="dots" title="Open player"></button>
            </div>
            <div class="player-lyric" id="player-lyric" hidden></div>
          </section>

          <!-- Dashboard: hover home -->
          <section class="panel" id="panel-dashboard" hidden>
            <div class="dash-bar">
              <button class="bar-btn" data-view="dashboard" data-icon="home" title="Home"></button>
              <button class="bar-btn" id="btn-add-app" data-icon="plus" title="Add app"></button>
              <span class="spacer"></span>
              <button class="chip" id="chip-cpu" data-view="perf" title="System status"><i data-icon="cpu" data-size="14"></i><span id="chip-cpu-val">CPU --%</span></button>
              <button class="chip" id="chip-weather" data-view="weather" title="Weather"><i id="chip-weather-icon" data-icon="partly" data-size="14"></i><span id="chip-weather-val">--°</span></button>
              <button class="bar-btn" data-settings data-icon="cog" title="Settings"></button>
              <button class="bar-btn" id="btn-collapse" data-icon="chevronUp" title="Collapse"></button>
            </div>
            <div class="dash-grid">
              <div class="tile" id="assistant-card">
                <span class="avatar" id="assistant-avatar"></span>
                <span class="tile-col"><span class="tile-title">Claude Code</span><span class="tile-sub">Offline</span></span>
              </div>
              <button class="tile" id="tile-media" data-view="media">
                <img class="tile-art" id="tile-media-art" alt="" hidden />
                <span class="tile-col">
                  <span class="tile-title"><i data-icon="music" data-size="16"></i><span id="tile-media-title">Nothing playing</span></span>
                  <span class="tile-sub" id="tile-media-artist"></span>
                </span>
              </button>
              <button class="tile" id="tile-focus" title="Click to start/pause, scroll to change"></button>
              <!-- Calendar card (was the clock tile); a div because it holds the +/Join buttons. Click → agenda. -->
              <div class="tile" id="tile-clock" role="button" tabindex="0" title="Today's agenda">
                <div class="cal-head">
                  <span class="cal-date" id="cal-date"></span>
                  <span class="cal-count" id="cal-count"></span>
                  <button class="bar-btn cal-add" id="btn-cal-link" data-icon="plus" data-size="14" title="Calendar link"></button>
                </div>
                <div id="cal-body"></div>
              </div>
              <button class="tile" id="tile-settings" data-settings>
                <span class="tile-title"><i data-icon="cog" data-size="16"></i>Settings</span>
              </button>
            </div>
            <div id="launcher"></div>
          </section>

          <!-- System status -->
          <section class="panel" id="panel-perf" hidden>
            <div class="panel-head">
              <span class="panel-title">System Status</span>
              <button class="action-btn" data-action="taskmgr" data-icon="open" data-size="16" title="Task Manager"></button>
              <button class="action-btn" data-view="dashboard" data-icon="home" data-size="16" title="Home"></button>
            </div>
            <div class="stat-grid">
              <div class="stat"><div class="stat-label"><i data-icon="cpu" data-size="14"></i>CPU</div><div class="stat-val" id="cpu-val">0%</div><div class="bar"><div id="cpu-bar"></div></div></div>
              <div class="stat"><div class="stat-label"><i data-icon="memory" data-size="14"></i>RAM</div><div class="stat-val" id="ram-val">0%</div><div class="bar"><div id="ram-bar"></div></div></div>
              <div class="stat"><div class="stat-label"><i data-icon="disk" data-size="14"></i>STORAGE</div><div class="stat-val" id="disk-val">0%</div><div class="bar"><div id="disk-bar"></div></div></div>
              <div class="stat"><div class="stat-label"><i data-icon="web" data-size="14"></i>NETWORK</div><div class="net" id="net-down">↓ 0 KB/s</div><div class="net" id="net-up">↑ 0 KB/s</div></div>
            </div>
          </section>

          <!-- Weather -->
          <section class="panel" id="panel-weather" hidden>
            <div class="weather-top">
              <div>
                <div class="weather-city" id="weather-city">—</div>
                <div class="weather-cond" id="weather-cond">Loading...</div>
              </div>
              <div class="weather-temp" id="weather-temp">--°</div>
            </div>
            <div class="hourly" id="hourly"></div>
            <div class="weather-tools">
              <button class="action-btn" id="btn-edit-location" data-icon="pencil" data-size="15" title="Change location"></button>
              <button class="action-btn" data-action="weather" data-icon="open" data-size="15" title="Open Weather app"></button>
              <button class="action-btn" data-view="dashboard" data-icon="home" data-size="15" title="Home"></button>
            </div>
            <form class="location-form" id="location-form" hidden>
              <input id="location-input" placeholder="City name" maxlength="100" autocomplete="off" />
              <button type="submit" class="btn primary">Save</button>
              <button type="button" class="btn" id="location-cancel">Cancel</button>
            </form>
          </section>

          <!-- Agenda: today's calendar events + link editor -->
          <section class="panel" id="panel-agenda" hidden>
            <div class="panel-head">
              <span class="panel-title">Today</span>
              <button class="link-btn" data-view="calendar">Tasks</button>
              <button class="link-btn agenda-month" data-view="month">Month</button>
              <button class="action-btn" id="btn-agenda-link" data-icon="pencil" data-size="16" title="Calendar link"></button>
              <button class="action-btn" data-view="dashboard" data-icon="home" data-size="16" title="Home"></button>
            </div>
            <div id="agenda-list"></div>
            <form class="location-form" id="cal-form" hidden>
              <input id="cal-input" placeholder="Paste your calendar's secret iCal link" maxlength="2100" autocomplete="off" spellcheck="false" />
              <button type="submit" class="btn primary">Save</button>
              <button type="button" class="btn" id="cal-remove">Remove</button>
              <button type="button" class="btn" id="cal-cancel">Cancel</button>
            </form>
          </section>

          <!-- Tasks: view mode + edit mode -->
          <section class="panel" id="panel-calendar" hidden>
            <div id="task-view">
              <div class="panel-head">
                <button class="action-btn" id="btn-edit-tasks" data-icon="pencil" data-size="16" title="Manage tasks"></button>
                <span class="panel-title">Next Up</span>
                <span class="muted" id="task-count">0 tasks</span>
                <button class="link-btn" data-view="month">Month</button>
                <button class="action-btn" data-view="dashboard" data-icon="home" data-size="16" title="Home"></button>
              </div>
              <div id="task-list"></div>
            </div>
            <div id="task-edit" hidden>
              <div class="panel-title big">Manage Tasks</div>
              <ul class="edit-list" id="edit-list"></ul>
              <form id="task-form" class="task-form">
                <input id="task-name" placeholder="Task Name" maxlength="100" autocomplete="off" />
                <input id="task-time" placeholder="Time (e.g. 3:00 PM)" maxlength="30" autocomplete="off" />
                <select id="task-cat">
                  <option>Work</option><option>Health</option><option>Personal</option><option>Study</option><option>Other</option>
                </select>
                <button type="submit" class="btn">Add</button>
                <button type="button" class="btn" id="task-delete">Delete Selected</button>
              </form>
              <button class="btn primary wide" id="task-done">Done</button>
            </div>
          </section>

          <!-- Month progress -->
          <section class="panel" id="panel-month" hidden>
            <div class="panel-head">
              <span class="panel-title" id="month-title">Month Progress</span>
              <span class="month-pct" id="month-pct">0%</span>
              <button class="action-btn" data-action="datetime" data-icon="open" data-size="16" title="Date &amp; time settings"></button>
              <button class="action-btn" data-view="dashboard" data-icon="home" data-size="16" title="Home"></button>
            </div>
            <div class="dots" id="month-dots"></div>
          </section>
        </div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
