[package]
name = "dynamic-notch"
version = "0.2.9"
description = "Dynamic Island for Windows, written in Rust (Tauri 2 + SQLite)"
edition = "2021"
publish = false

[lib]
name = "dynamic_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rrule = "0.14.0"
chrono-tz = "0.10"
chrono = "0.4"
icalendar = { version = "0.17.17", default-features = false, features = ["parser"] }
# dictation (spec §23.7)
cpal = "0.18"
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
# NFC + combining marks, so dictionary/snippets match Bangla and other non-Latin scripts
unicode-normalization = "0.1"
# offline speech to text: sherpa-onnx (Apache-2.0) + NVIDIA Parakeet / Meta Omnilingual ASR, onnxruntime
# linked statically (prebuilt libs are downloaded at build time); models are downloaded on the user's click.
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
drag = "2.1" # native drag-out of shelf files
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] } # wired / wireless peripherals and their battery
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Radios",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "ApplicationModel_Appointments",
  "UI_ViewManagement",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Shutdown",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_Display",
  "Win32_System_Performance",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false }
gtk = "0.18" # same version Tauri uses: the island's input shape (click-through)
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
