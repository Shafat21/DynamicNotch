[package]
name = "dynamic-notch"
version = "0.1.0"
description = "Dynamic Island for Windows, written in Rust (Tauri 2 + SQLite)"
edition = "2021"
publish = false

[lib]
name = "dynamic_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rrule = "0.14.0"
chrono-tz = "0.10"
chrono = "0.4"
icalendar = { version = "0.17.17", default-features = false, features = ["parser"] }
# dictation (spec §23.7)
cpal = "0.18"
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
whisper-rs = { version = "0.16", optional = true }

[features]
# whisper.cpp needs CMake + a C++ toolchain; off by default so plain `cargo test` stays fast.
local-whisper = ["dep:whisper-rs"]

[target.'cfg(windows)'.dependencies]
drag = "2.1" # native drag-out of shelf files
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_Radios",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "UI_ViewManagement",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Shutdown",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_Display",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
