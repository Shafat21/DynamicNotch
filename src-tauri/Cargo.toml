[package]
name = "dynamic-notch"
version = "0.1.0"
description = "Dynamic Island for Windows, written in Rust (Tauri 2 + SQLite)"
edition = "2021"
publish = false

[lib]
name = "dynamic_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rrule = "0.14.0"
chrono-tz = "0.10"
chrono = "0.4"
icalendar = { version = "0.17.17", default-features = false, features = ["parser"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "UI_ViewManagement",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
